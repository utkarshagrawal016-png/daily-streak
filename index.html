<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Streak Tracker</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 50px;
  }
  h1 { margin-bottom: 5px; }
  .subtitle { color: #8b949e; margin-bottom: 30px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 20px);
    grid-auto-flow: column;
    gap: 4px;
  }
  .day {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: #161b22; /* empty */
  }
  .done { background: #39d353; } /* filled = habit done that day */
</style>
</head>
<body>

<h1>🔥 Daily Streak Tracker</h1>
<p class="subtitle">Japanese practice — day by day</p>
<p id="streak-text" style="font-size: 20px; font-weight: bold; color: #58a6ff;"></p>
<div class="grid" id="grid"></div>

<script>
  const days = [
    true, true, false, true, true, true, false,
    true, true, true, true, false, true, true,
    false, false, true, true, true, true, true,
    true, true, false, true, true, true, true
  ];

  const grid = document.getElementById('grid');

  days.forEach(done => {
    const cell = document.createElement('div');
    cell.className = 'day' + (done ? ' done' : '');
    grid.appendChild(cell);
  });

  const todayKey = 'streak-' + new Date().toISOString().slice(0, 10);

  const today = document.createElement('div');
  today.className = 'day';
  today.style.border = '2px solid #58a6ff';
  today.style.cursor = 'pointer';
  today.title = "Click to mark today's habit as done";

  if (localStorage.getItem(todayKey) === 'true') {
    today.classList.add('done');
  }

  today.addEventListener('click', () => {
    today.classList.toggle('done');
    localStorage.setItem(todayKey, today.classList.contains('done'));
    updateStreakDisplay();
  });

  grid.appendChild(today);

  // NEW: streak counter logic
  function calculateStreak() {
    // Count backwards from the end of hardcoded days, then include today if done
    let streak = 0;
    const todayDone = localStorage.getItem(todayKey) === 'true';

    if (todayDone) streak++;

    for (let i = days.length - 1; i >= 0; i--) {
      if (days[i]) {
        streak++;
      } else {
        break;
      }
    }

    return streak;
  }

  function updateStreakDisplay() {
    const streak = calculateStreak();
    document.getElementById('streak-text').textContent =
      streak > 0 ? `🔥 ${streak} day streak` : `Start your streak today`;
  }

  updateStreakDisplay();
</script>

</body>
</html>
